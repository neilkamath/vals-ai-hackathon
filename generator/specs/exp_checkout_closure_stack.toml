id = "exp-checkout-closure-stack"
world = "experiment"
seed = 3
description = "Closure type: bots, retries and a renamed event all get fixed; the underlying assignment skew only shows after bots are removed. Correct output is cannot_determine."
difficulty = "very-hard-unanswerable"
question = """In the checkout experiment, what was the lift in revenue per customer (treatment minus control, in USD)?

Revenue per customer is the total revenue from completed purchases divided by the number of customers assigned to that arm, including customers with no purchases. Use all of the data in `/app`."""
tolerance_abs = 0.01
clue = "none"
expected_status = "cannot_determine"
raw_balanced = true

[world_params]
n_users = 3000
noise = 60
start = "2026-02-16"
days = 42
base_rate = 0.03
lift = 1.15
repeat_rate = 0.06
whale_rate = 0.003

[[change_events]]
type = "split_skew"
frac_drop = 0.43
clue = "none"

[[change_events]]
type = "duplicate_retries"
from_date = "2026-03-09"
rate = 0.3
clue = "etl_script"
pad = 20

[[change_events]]
type = "event_rename"
cutover = "2026-03-12"
clue = "migration_sql"

[[change_events]]
type = "bot_traffic"
n_bots = 400
treat_frac = 0.9
clue = "none"
