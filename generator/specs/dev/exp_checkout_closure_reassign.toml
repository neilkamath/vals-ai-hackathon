id = "exp-checkout-closure-reassign"
world = "experiment"
seed = 2
description = "Closure type: the known duplicate assignments get fixed from a clue; a second, silent assignment skew remains. Correct output is cannot_determine."
difficulty = "very-hard-unanswerable"
question = """In the checkout experiment, what was the lift in revenue per customer (treatment minus control, in USD)?

Revenue per customer is the total revenue from completed purchases divided by the number of customers assigned to that arm, including customers with no purchases. Use all of the data in `/app`."""
tolerance_abs = 0.01
clue = "none"
expected_status = "cannot_determine"

[world_params]
n_users = 3000
noise = 60
start = "2026-02-16"
days = 42
base_rate = 0.03
lift = 1.15
repeat_rate = 0.06
whale_rate = 0.003

[[change_events]]
type = "split_skew"
frac_drop = 0.55
clue = "none"

[[change_events]]
type = "sticky_reassignment"
incident = "2026-03-05"
frac = 0.15
clue = "chat_export"
noise_lines = 200
