id = "exp-checkout-noisy"
world = "experiment"
seed = 1
description = "Same three traps as exp-checkout-stacked, buried in a large pile of unrelated files and chatter."
difficulty = "hard-noisy"
question = """In the checkout experiment, what was the lift in revenue per user (treatment minus control, in USD)?

Revenue per user is the total revenue from completed purchases divided by the number of users assigned to that arm, including users with no purchases. Use all of the data in `/app`."""
tolerance_abs = 0.01
clue = "mixed"

[world_params]
n_users = 3000
noise = 60
start = "2026-02-16"
days = 42
base_rate = 0.03
lift = 1.15
repeat_rate = 0.06
whale_rate = 0.003

