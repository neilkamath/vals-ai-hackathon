id = "energy-meter-closure-day"
seed = 13
description = "Same files as energy-meter-stuck-day. The question day is a real holiday closure with low but real load, and the meter is fine. Report the number; do not treat low load as a dead meter."
difficulty = "paired-clean"
question = """What was the total electricity consumption of the site on 2026-11-27 (the site's local calendar day), in kWh?

Use all of the data in `/app`."""
world = "meter"
tolerance_rel = 0.01
clue = "mixed"
window_start = "2026-11-27T00:00:00"
window_end = "2026-11-28T00:00:00"
validate = false
ablate = ["no_multiplier_fix", "bounds_read_as_utc"]
scored_traps = ["multiplier_change"]

[world_params]
start_local = "2026-10-01T00:00:00"
end_local = "2026-12-02T00:00:00"
start_register = 970000.0
closure_start = "2026-11-26"
closure_end = "2026-11-29"

[[change_events]]
type = "utc_timestamps"
clue = "none"

[[change_events]]
type = "multiplier_change"
cutover = "2026-11-13T10:00:00"
factor = 10
clue = "maintenance_log"

[[change_events]]
type = "stuck_meter"
start = "2026-11-19T12:00:00"
end = "2026-11-21T06:00:00"
clue = "none"

[[change_events]]
type = "register_rollover"
modulus = 1000000.0
clue = "datasheet"
