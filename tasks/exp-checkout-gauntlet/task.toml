version = "1.0"

[task]
name = "silent-errors/exp-checkout-gauntlet"
description = "Four recording problems (bots with no clue, retries, reassignment, event rename) plus refunds to join, in a pile of unrelated files."

[metadata]
difficulty = "very-hard"
category = "data-analysis"

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com"]

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
