version = "1.0"

[task]
name = "silent-errors/exp-checkout-noisy"
description = "Same three traps as exp-checkout-stacked, buried in a large pile of unrelated files and chatter."

[metadata]
difficulty = "hard-noisy"
category = "data-analysis"

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com"]

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
