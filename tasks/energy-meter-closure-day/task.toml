version = "1.0"

[task]
name = "silent-errors/energy-meter-closure-day"
description = "Same files as energy-meter-stuck-day. The question day is a real holiday closure with low but real load, and the meter is fine. Report the number; do not treat low load as a dead meter."

[metadata]
difficulty = "paired-clean"
category = "data-analysis"

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com"]

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
