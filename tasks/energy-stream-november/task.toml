version = "1.0"

[task]
name = "silent-errors/energy-stream-november"
description = "Streamed intake: paged meter API with overlapping pages, rate limiting, a mid-stream format change (Wh and epoch time), a CT-ratio change and a local month over UTC records."

[metadata]
difficulty = "very-hard"
category = "data-analysis"

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com"]

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
