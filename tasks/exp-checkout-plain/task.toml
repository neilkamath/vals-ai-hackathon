version = "1.0"

[task]
name = "silent-errors/exp-checkout-plain"
description = "Clean control: no recording problems and no decoys at all. The right move is to report the number, not to abstain."

[metadata]
difficulty = "control-clean"
category = "data-analysis"

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com"]

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
